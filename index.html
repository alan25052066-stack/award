<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>游戏挑战系统 · 铁腚奖</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 第一关：火影忍者 -->
  <section class="level-section" style="background-image: url('assets/naruto-bg.png')">
    <div class="level-content">
      <h2>🔥 火影忍者挑战</h2>
      <p>完成5个任务，获得木叶护额！</p>
      <button class="btn">开始挑战</button>
    </div>
  </section>

  <!-- 第二关：原神 -->
  <section class="level-section" style="background-image: url('assets/genshin-bg.png')">
    <div class="level-content">
      <h2>⚔️ 原神冒险</h2>
      <p>探索提瓦特，击败深渊法师！</p>
      <button class="btn">开始挑战</button>
    </div>
  </section>

  <!-- 第三关：CS2 -->
  <section class="level-section" style="background-image: url('assets/cs2-bg.png')">
    <div class="level-content">
      <h2>反恐精英行动</h2>
      <p>赢得10局竞技模式！</p>
      <button class="btn">开始挑战</button>
    </div>
  </section>

  <!-- 第四关：三角洲行动 -->
  <section class="level-section" style="background-image: url('assets/delta-bg.png')">
    <div class="level-content">
      <h2>三角洲行动</h2>
      <p>完成“黑鹰坠落”战役，营救所有干员！</p>
      <button class="btn">开始挑战</button>
    </div>
  </section>

  <!-- 第五关：泰拉瑞亚 -->
  <section class="level-section" style="background-image: url('assets/terraria-bg.png')">
    <div class="level-content">
      <h2>泰拉瑞亚世界</h2>
      <p>击败史莱姆之王</p>
      <button class="btn">开始挑战</button>
    </div>
  </section>

  <!-- 最终关：星野颁奖典礼（铁腚奖） -->
  <section id="final-award-section" style="background-image: url('assets/hoshino-stage-bg.png')">
    <div class="level-content award-content">
      <h2>小鸟游星野 · 颁奖典礼</h2>
      <div class="award-icon">
        <img src="assets/award-iron-butt.png" alt="铁腚奖" />
      </div>
      <p>恭喜你完成全部挑战！<br>荣获阿拜多斯对策委员会最高荣誉——</p>
      <h3>铁腚奖（Iron Butt Award）</h3>
      <p>“坐得住、打得赢、肝得动”</p>
    </div>
  </section>

</body>
</html>
