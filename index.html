<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全能游戏王·铁腚挑战</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 启动页 -->
    <div id="start-screen" class="screen">
        <h1> 全能玩家终极试炼</h1>
        <p>通关 5 大游戏挑战，赢取星野亲授奖章！</p>
        <button onclick="startGame()">开始挑战</button>
    </div>

    <!-- 三角洲：快速点击 -->
    <div id="delta-screen" class="screen hidden">
        <img src="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/delta-force.png" alt="三角洲" class="game-icon">
        <h2>【三角洲行动】急停开镜训练</h2>
        <p>3 秒内点击 <strong>10 次</strong>！</p>
        <button id="delta-btn" class="game-btn">快点我！</button>
        <div id="delta-counter">点击数: 0</div>
    </div>

    <!-- CS2：摇一摇 -->
    <div id="cs2-screen" class="screen hidden">
        <img src="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/counter-strike.png" alt="CS2" class="game-icon">
        <h2>【CS2】跳狙颠簸模拟</h2>
        <p>剧烈摇晃手机，完成 <strong>10 次颠簸</strong></p>
        <div class="shake-indicator" id="cs2-shake">颠簸: 0/10</div>
    </div>

    <!-- 泰拉瑞亚：长按挖掘 -->
    <div id="terraria-screen" class="screen hidden">
        <img src="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/terraria.png" alt="泰拉瑞亚" class="game-icon">
        <h2>【泰拉瑞亚】地狱挖矿</h2>
        <p>长按按钮 <strong>5 秒</strong>，挖出永夜刃！</p>
        <button id="terraria-btn" class="hold-btn">按住挖掘</button>
        <div class="progress-bar"><div id="terraria-progress" class="progress-fill"></div></div>
    </div>

    <!-- 火影：连打 -->
    <div id="naruto-screen" class="screen hidden">
        <img src="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/naruto.png" alt="火影" class="game-icon">
        <h2>【火影忍者】奥义连打</h2>
        <p>5 秒内狂点 <strong>20 次</strong>！</p>
        <button id="naruto-btn" class="game-btn">搓招！</button>
        <div id="naruto-counter">连打: 0/20</div>
    </div>

    <!-- 原神：滑动收集 -->
    <div id="genshin-screen" class="screen hidden">
        <img src="https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/genshin-impact.png" alt="原神" class="game-icon">
        <h2>【原神】收集神瞳</h2>
        <p>在屏幕上 <strong>滑动 5 次</strong> 收集散落的神瞳</p>
        <div id="genshin-area">滑动这里</div>
        <div id="genshin-counter">已收集: 0/5</div>
    </div>

    <!-- 颁奖页 -->
    <div id="award-screen" class="screen hidden">
        <div class="certificate">
            <img src="assets/hoshino.png" alt="星野" class="character-icon">
            <h1>【全能铁腚王】SSS级认证</h1>
            <p>授予：<strong>超娃子</strong></p>
            <p>成功通关全部 5 大游戏耐力试炼！</p>
            <small>“老师，你的腚真的超厉害……”</small>
        </div>
        <button onclick="location.reload()">再玩一次</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
